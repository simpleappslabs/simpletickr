openapi: 3.1.0

info:
  title: simpletickr API
  version: 0.1.0
  description: Simple portfolio tracker for ETFs, stocks, and crypto.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8080
    description: Local development

security: []

tags:
  - name: Portfolios
  - name: Assets
  - name: Transactions
  - name: Prices

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: UP
        "4XX":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "5XX":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /portfolios:
    get:
      tags: [Portfolios]
      operationId: listPortfolios
      summary: List all portfolios
      responses:
        "200":
          description: List of portfolios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Portfolio"
    post:
      tags: [Portfolios]
      operationId: createPortfolio
      summary: Create a portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioRequest"
      responses:
        "201":
          description: Portfolio created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"

  /portfolios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Portfolios]
      operationId: getPortfolio
      summary: Get a portfolio by ID
      responses:
        "200":
          description: Portfolio found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Portfolios]
      operationId: updatePortfolio
      summary: Update a portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioRequest"
      responses:
        "200":
          description: Portfolio updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Portfolios]
      operationId: deletePortfolio
      summary: Delete a portfolio
      responses:
        "204":
          description: Portfolio deleted
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /portfolios/{portfolioId}/transactions:
    parameters:
      - name: portfolioId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Transactions]
      operationId: recordTransaction
      summary: Record a transaction in a portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
      responses:
        "201":
          description: Transaction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /portfolios/{portfolioId}/transactions/{id}:
    parameters:
      - name: portfolioId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: [Transactions]
      operationId: amendTransaction
      summary: Amend a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
      responses:
        "200":
          description: Transaction amended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Transactions]
      operationId: removeTransaction
      summary: Remove a transaction
      responses:
        "204":
          description: Transaction removed
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /portfolios/{id}/realized-gains:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Portfolios]
      operationId: getRealizedGains
      summary: Compute realized gains for a portfolio
      parameters:
        - name: method
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/RealizationMethod"
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Realized gains report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealizedGainsReport"
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /portfolios/{id}/holdings:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Portfolios]
      operationId: getHoldings
      summary: Get computed holdings for a portfolio
      responses:
        "200":
          description: Holdings for the portfolio
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holding"
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: List all assets
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      tags: [Assets]
      operationId: createAsset
      summary: Create an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetRequest"
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "409":
          description: Asset conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /assets/{id}/listings:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Assets]
      operationId: createListing
      summary: Add a listing to an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingRequest"
      responses:
        "201":
          description: Listing created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /listings/{id}/price-mappings:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Prices]
      operationId: listPriceMappings
      summary: List all price provider mappings for a listing
      responses:
        "200":
          description: Price mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceMapping"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /listings/{id}/price-mappings/{provider}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: provider
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Prices]
      operationId: getPriceMapping
      summary: Get the price mapping for a provider on a listing
      responses:
        "200":
          description: Price mapping found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceMapping"
        "404":
          description: Listing or mapping not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Prices]
      operationId: setPriceMapping
      summary: Set the external ID for a price provider on a listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceMappingRequest"
      responses:
        "200":
          description: Price mapping set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceMapping"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Prices]
      operationId: deletePriceMapping
      summary: Remove a price provider mapping from a listing
      responses:
        "204":
          description: Mapping removed
        "404":
          description: Listing or mapping not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /listings/{id}/price-history:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Prices]
      operationId: getPriceHistory
      summary: Get price history for a listing
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PricePoint"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /prices/sync:
    post:
      tags: [Prices]
      operationId: syncPrices
      summary: Trigger a manual price sync for all mapped listings
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /listings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: [Assets]
      operationId: updateListing
      summary: Update a listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingRequest"
      responses:
        "200":
          description: Listing updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Assets]
      operationId: deleteListing
      summary: Delete a listing
      responses:
        "204":
          description: Listing deleted
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /assets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Get an asset by ID
      responses:
        "200":
          description: Asset found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Assets]
      operationId: updateAsset
      summary: Update an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetRequest"
      responses:
        "200":
          description: Asset updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Assets]
      operationId: deleteAsset
      summary: Delete an asset
      responses:
        "204":
          description: Asset deleted
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List transactions, optionally filtered by portfolio
      parameters:
        - name: portfolioId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /transactions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get a transaction by ID
      responses:
        "200":
          description: Transaction found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    Portfolio:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    PortfolioRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    Asset:
      type: object
      required:
        - id
        - name
        - type
        - listings
      properties:
        id:
          type: integer
          format: int64
        isin:
          type: string
          nullable: true
          example: IE00B3RBWM25
        name:
          type: string
          example: Vanguard FTSE All-World
        type:
          $ref: "#/components/schemas/AssetType"
        listings:
          type: array
          items:
            $ref: "#/components/schemas/Listing"

    AssetRequest:
      type: object
      required:
        - name
        - type
      properties:
        isin:
          type: string
          nullable: true
        name:
          type: string
        type:
          $ref: "#/components/schemas/AssetType"
        listing:
          $ref: "#/components/schemas/ListingRequest"
          nullable: true

    Listing:
      type: object
      required:
        - id
        - assetId
        - ticker
        - currency
      properties:
        id:
          type: integer
          format: int64
        assetId:
          type: integer
          format: int64
        exchange:
          type: string
          nullable: true
          example: Euronext Amsterdam
        ticker:
          type: string
          example: VWCE
        currency:
          type: string
          example: EUR

    ListingRequest:
      type: object
      required:
        - ticker
        - currency
      properties:
        exchange:
          type: string
          nullable: true
        ticker:
          type: string
        currency:
          type: string

    AssetType:
      type: string
      enum:
        - STOCK
        - ETF
        - CRYPTO
        - OTHER

    Transaction:
      type: object
      required:
        - id
        - portfolioId
        - listingId
        - assetId
        - type
        - quantity
        - price
        - date
      properties:
        id:
          type: integer
          format: int64
        portfolioId:
          type: integer
          format: int64
        listingId:
          type: integer
          format: int64
        assetId:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/TransactionType"
        quantity:
          type: number
          format: double
        price:
          type: number
          format: double
        date:
          type: string
          format: date
        fees:
          type: number
          format: double
          nullable: true

    TransactionRequest:
      type: object
      required:
        - listingId
        - type
        - quantity
        - price
        - date
      properties:
        listingId:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/TransactionType"
        quantity:
          type: number
          format: double
        price:
          type: number
          format: double
        date:
          type: string
          format: date
        fees:
          type: number
          format: double
          nullable: true

    TransactionType:
      type: string
      enum:
        - BUY
        - SELL

    PriceMapping:
      type: object
      required: [id, listingId, provider, externalId]
      properties:
        id:
          type: integer
          format: int64
        listingId:
          type: integer
          format: int64
        provider:
          type: string
          example: YAHOO
        externalId:
          type: string
          example: VWCE.AS

    PriceMappingRequest:
      type: object
      required: [externalId]
      properties:
        externalId:
          type: string
          example: VWCE.AS

    PricePoint:
      type: object
      required: [date, price]
      properties:
        date:
          type: string
          format: date
        price:
          type: number
          format: double

    SyncResult:
      type: object
      required: [synced, failed]
      properties:
        synced:
          type: integer
        failed:
          type: integer

    RealizationMethod:
      type: string
      enum:
        - FIFO
        - AVERAGE_COST

    RealizedGainEntry:
      type: object
      required:
        - assetId
        - ticker
        - date
        - quantity
        - proceeds
        - buyFees
        - sellFees
        - costBasis
        - gain
      properties:
        assetId:
          type: integer
          format: int64
        ticker:
          type: string
        date:
          type: string
          format: date
        quantity:
          type: number
          format: double
        proceeds:
          type: number
          format: double
        buyFees:
          type: number
          format: double
        sellFees:
          type: number
          format: double
        costBasis:
          type: number
          format: double
        gain:
          type: number
          format: double

    RealizedGainsReport:
      type: object
      required:
        - method
        - from
        - to
        - entries
        - totalProceeds
        - totalBuyFees
        - totalSellFees
        - totalCostBasis
        - totalGain
      properties:
        method:
          $ref: "#/components/schemas/RealizationMethod"
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: "#/components/schemas/RealizedGainEntry"
        totalProceeds:
          type: number
          format: double
        totalBuyFees:
          type: number
          format: double
        totalSellFees:
          type: number
          format: double
        totalCostBasis:
          type: number
          format: double
        totalGain:
          type: number
          format: double

    Holding:
      type: object
      required:
        - assetId
        - ticker
        - name
        - quantity
        - avgCostBasis
        - totalCost
      properties:
        assetId:
          type: integer
          format: int64
        ticker:
          type: string
        name:
          type: string
        quantity:
          type: number
          format: double
        avgCostBasis:
          type: number
          format: double
        totalCost:
          type: number
          format: double
        unrealizedGain:
          type: number
          format: double
          nullable: true