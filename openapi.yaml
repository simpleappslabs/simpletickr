openapi: 3.1.0

info:
  title: simpletickr API
  version: 0.1.0
  description: Simple portfolio tracker for ETFs, stocks, and crypto.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8080
    description: Local development

security: []

tags:
  - name: Portfolios
  - name: Assets
  - name: ListingSearch
  - name: Transactions
  - name: Prices
  - name: FX
  - name: Settings
  - name: Sync
  - name: Import
  - name: DataExport

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: UP
        "4XX":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "5XX":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /portfolios:
    get:
      tags: [Portfolios]
      operationId: listPortfolios
      summary: List all portfolios
      responses:
        "200":
          description: List of portfolios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Portfolio"
    post:
      tags: [Portfolios]
      operationId: createPortfolio
      summary: Create a portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioRequest"
      responses:
        "201":
          description: Portfolio created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"

  /portfolios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Portfolios]
      operationId: getPortfolio
      summary: Get a portfolio by ID
      responses:
        "200":
          description: Portfolio found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Portfolios]
      operationId: updatePortfolio
      summary: Update a portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioRequest"
      responses:
        "200":
          description: Portfolio updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Portfolios]
      operationId: deletePortfolio
      summary: Delete a portfolio
      responses:
        "204":
          description: Portfolio deleted
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /portfolios/{portfolioId}/transactions:
    parameters:
      - name: portfolioId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Transactions]
      operationId: recordTransaction
      summary: Record a transaction in a portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
      responses:
        "201":
          description: Transaction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /portfolios/{portfolioId}/transactions/{id}:
    parameters:
      - name: portfolioId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: [Transactions]
      operationId: amendTransaction
      summary: Amend a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
      responses:
        "200":
          description: Transaction amended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Transactions]
      operationId: removeTransaction
      summary: Remove a transaction
      responses:
        "204":
          description: Transaction removed
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /portfolios/{id}/realized-gains:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Portfolios]
      operationId: getRealizedGains
      summary: Compute realized gains for a portfolio
      parameters:
        - name: method
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/RealizationMethod"
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Realized gains report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealizedGainsReport"
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /portfolios/{id}/holdings:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Portfolios]
      operationId: getHoldings
      summary: Get computed holdings for a portfolio
      responses:
        "200":
          description: Holdings for the portfolio
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holding"
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /portfolios/{id}/value-history:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Portfolios]
      operationId: getPortfolioValueHistory
      summary: Get daily total portfolio value over a date range
      parameters:
        - name: from
          in: query
          required: false
          description: "Start date (inclusive). Defaults to the portfolio's oldest transaction date."
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Time series of daily portfolio value and invested amount in base currency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioValueHistory"
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /portfolios/{id}/sync-prices:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Portfolios]
      operationId: syncPortfolioPrices
      summary: Backfill price history for all listings in a portfolio from the oldest transaction date
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: List all assets
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      tags: [Assets]
      operationId: createAsset
      summary: Create an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetRequest"
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "409":
          description: Asset conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /assets/{id}/listings:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Assets]
      operationId: createListing
      summary: Add a listing to an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingRequest"
      responses:
        "201":
          description: Listing created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /listings/{id}/price-mappings:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Prices]
      operationId: listPriceMappings
      summary: List all price provider mappings for a listing
      responses:
        "200":
          description: Price mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceMapping"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /listings/{id}/price-mappings/{provider}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: provider
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Prices]
      operationId: getPriceMapping
      summary: Get the price mapping for a provider on a listing
      responses:
        "200":
          description: Price mapping found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceMapping"
        "404":
          description: Listing or mapping not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Prices]
      operationId: setPriceMapping
      summary: Set the external ID for a price provider on a listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceMappingRequest"
      responses:
        "200":
          description: Price mapping set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceMapping"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Prices]
      operationId: deletePriceMapping
      summary: Remove a price provider mapping from a listing
      responses:
        "204":
          description: Mapping removed
        "404":
          description: Listing or mapping not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /listings/{id}/price-history:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Prices]
      operationId: getPriceHistory
      summary: Get price history for a listing
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Price history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PricePoint"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /settings:
    get:
      tags: [Settings]
      operationId: getSettings
      summary: Get user settings
      responses:
        "200":
          description: User settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
    put:
      tags: [Settings]
      operationId: updateSettings
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /prices/sync:
    post:
      tags: [Prices]
      operationId: syncPrices
      summary: Trigger a manual price sync for all mapped listings
      parameters:
        - name: from
          in: query
          required: false
          description: Start of the history window (defaults to today minus configured lookback-days)
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: End of the history window (defaults to today)
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /fx/rate:
    get:
      tags: [FX]
      operationId: lookupFxRate
      summary: Look up (or on-demand fetch) the FX rate for a currency pair on a given date
      parameters:
        - name: base
          in: query
          required: true
          schema:
            type: string
        - name: quote
          in: query
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Rate found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxRatePoint"
        "404":
          description: Rate not available for this pair and date

  /fx/sync:
    post:
      tags: [FX]
      operationId: syncFxRates
      summary: Trigger a manual FX rate sync for all currency pairs derived from portfolio listings
      parameters:
        - name: from
          in: query
          required: false
          description: Start of the history window (defaults to today minus configured lookback-days)
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: End of the history window (defaults to today)
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /sync/history:
    get:
      tags: [Sync]
      operationId: getSyncHistory
      summary: Get recent sync history entries for a given sync type
      parameters:
        - name: type
          in: query
          required: true
          description: The sync type to filter by
          schema:
            $ref: "#/components/schemas/SyncType"
        - name: limit
          in: query
          required: false
          description: Maximum number of entries to return (default 20)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Recent sync history entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncHistoryEntry"
        "400":
          description: Invalid sync type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /listings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: [Assets]
      operationId: updateListing
      summary: Update a listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingRequest"
      responses:
        "200":
          description: Listing updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Assets]
      operationId: deleteListing
      summary: Delete a listing
      responses:
        "204":
          description: Listing deleted
        "404":
          description: Listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /assets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Get an asset by ID
      responses:
        "200":
          description: Asset found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetDetail"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Assets]
      operationId: updateAsset
      summary: Update an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssetRequest"
      responses:
        "200":
          description: Asset updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Assets]
      operationId: deleteAsset
      summary: Delete an asset
      responses:
        "204":
          description: Asset deleted
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Asset has linked transactions and cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /listing-search:
    get:
      tags: [ListingSearch]
      operationId: searchListings
      summary: Search for listings via a search provider
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of matching listing results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListingSearchResult"

  /transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List and search transactions with optional filters
      parameters:
        - name: portfolioId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TransactionType"
        - name: listingId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: dateFrom
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 25
      responses:
        "200":
          description: Paginated list of transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"

  /portfolios/{portfolioId}/transactions/import/bolero:
    parameters:
      - name: portfolioId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    post:
      tags: [Import]
      operationId: importBoleroTransactions
      summary: Import transactions from a Bolero XLS export
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import completed (best-effort; check rows for skipped entries)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /import/bolero/analyze:
    post:
      tags: [Import]
      operationId: analyzeBoleroImport
      summary: Parse a Bolero XLS and return unique instruments with existing mapping info
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoleroAnalysisResult"

  /import/asset-mappings:
    get:
      tags: [Import]
      operationId: listAssetImportMappings
      summary: List all asset import mappings
      parameters:
        - name: broker
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssetImportMapping"
    post:
      tags: [Import]
      operationId: createAssetImportMapping
      summary: Create an asset import mapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetImportMappingRequest"
      responses:
        "201":
          description: Mapping created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetImportMapping"
        "409":
          description: Mapping already exists for this broker + external name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /import/asset-mappings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags: [Import]
      operationId: deleteAssetImportMapping
      summary: Delete an asset import mapping
      responses:
        "204":
          description: Mapping deleted

  /transactions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get a transaction by ID
      responses:
        "200":
          description: Transaction found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /data-export:
    get:
      tags: [DataExport]
      operationId: exportData
      summary: Export all portfolio data as a JSON file
      responses:
        "200":
          description: JSON export file
          content:
            application/json:
              schema:
                type: string
                format: binary

  /data-import:
    post:
      tags: [DataExport]
      operationId: importData
      summary: Import portfolio data from a JSON export file
      parameters:
        - name: dryRun
          in: query
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Import analysis (dryRun=true) or import result (dryRun=false)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DataImportAnalysis"
                  - $ref: "#/components/schemas/DataImportResult"
        "400":
          description: Invalid file or validation errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /dashboard/widgets:
    get:
      tags: [Dashboard]
      operationId: listDashboardWidgets
      summary: List all dashboard widgets
      responses:
        "200":
          description: List of dashboard widgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DashboardWidget"
    post:
      tags: [Dashboard]
      operationId: addDashboardWidget
      summary: Add a dashboard widget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDashboardWidgetRequest"
      responses:
        "201":
          description: Widget created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardWidget"

  /dashboard/widgets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    patch:
      tags: [Dashboard]
      operationId: updateDashboardWidget
      summary: Update a dashboard widget's config (e.g. range)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDashboardWidgetRequest"
      responses:
        "200":
          description: Widget updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardWidget"
        "404":
          description: Widget not found
    delete:
      tags: [Dashboard]
      operationId: removeDashboardWidget
      summary: Remove a dashboard widget
      responses:
        "204":
          description: Widget removed
        "404":
          description: Widget not found

components:
  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    Portfolio:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    PortfolioRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    Asset:
      type: object
      required:
        - id
        - name
        - type
        - listings
      properties:
        id:
          type: integer
          format: int64
        isin:
          type: string
          nullable: true
          example: IE00B3RBWM25
        name:
          type: string
          example: Vanguard FTSE All-World
        type:
          $ref: "#/components/schemas/AssetType"
        listings:
          type: array
          items:
            $ref: "#/components/schemas/ListingWithPrice"

    CreateAssetRequest:
      type: object
      required:
        - name
        - type
        - listings
      properties:
        isin:
          type: string
          nullable: true
        name:
          type: string
        type:
          $ref: "#/components/schemas/AssetType"
        listings:
          type: array
          items:
            $ref: "#/components/schemas/ListingRequest"

    UpdateAssetRequest:
      type: object
      required:
        - name
        - type
      properties:
        isin:
          type: string
          nullable: true
        name:
          type: string
        type:
          $ref: "#/components/schemas/AssetType"

    Listing:
      type: object
      required:
        - id
        - assetId
        - ticker
        - currency
      properties:
        id:
          type: integer
          format: int64
        assetId:
          type: integer
          format: int64
        exchange:
          type: string
          nullable: true
          example: Euronext Amsterdam
        ticker:
          type: string
          example: VWCE
        currency:
          type: string
          example: EUR

    ListingDetail:
      type: object
      required:
        - id
        - assetId
        - ticker
        - currency
        - priceMappings
      properties:
        id:
          type: integer
          format: int64
        assetId:
          type: integer
          format: int64
        exchange:
          type: string
          nullable: true
          example: Euronext Amsterdam
        ticker:
          type: string
          example: VWCE
        currency:
          type: string
          example: EUR
        priceMappings:
          type: array
          items:
            $ref: "#/components/schemas/PriceMapping"

    AssetDetail:
      type: object
      required:
        - id
        - name
        - type
        - listings
      properties:
        id:
          type: integer
          format: int64
        isin:
          type: string
          nullable: true
          example: IE00B3RBWM25
        name:
          type: string
          example: Vanguard FTSE All-World
        type:
          $ref: "#/components/schemas/AssetType"
        listings:
          type: array
          items:
            $ref: "#/components/schemas/ListingDetail"

    ListingRequest:
      type: object
      required:
        - ticker
        - currency
      properties:
        exchange:
          type: string
          nullable: true
        ticker:
          type: string
        currency:
          type: string
        priceMappings:
          type: array
          items:
            $ref: "#/components/schemas/ListingPriceMappingRequest"

    ListingPriceMappingRequest:
      type: object
      required: [provider, externalId]
      properties:
        provider:
          type: string
          example: YAHOO
        externalId:
          type: string
          example: VWCE.AS

    ListingSearchResult:
      type: object
      required:
        - symbol
        - name
        - type
        - currency
      properties:
        symbol:
          type: string
          description: Symbol (used as externalId for price mapping)
          example: VWCE.DE
        name:
          type: string
          example: Vanguard FTSE All-World UCITS ETF
        type:
          $ref: "#/components/schemas/AssetType"
        exchange:
          type: string
          nullable: true
          example: XETRA
        currency:
          type: string
          nullable: true
          example: EUR

    AssetType:
      type: string
      enum:
        - STOCK
        - ETF
        - CRYPTO
        - OTHER

    TransactionPage:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        page:
          type: integer
          description: Current page (0-indexed)
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    Transaction:
      type: object
      required:
        - id
        - portfolioId
        - listingId
        - assetId
        - type
        - quantity
        - price
        - date
      properties:
        id:
          type: integer
          format: int64
        portfolioId:
          type: integer
          format: int64
        listingId:
          type: integer
          format: int64
        assetId:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/TransactionType"
        quantity:
          type: number
          format: double
        price:
          type: number
          format: double
        date:
          type: string
          format: date
        fees:
          type: number
          format: double
          nullable: true
        fxRate:
          type: number
          format: double
          nullable: true
          description: "FX rate at execution time: 1 baseCurrency = fxRate listingCurrency"
        fxRateSource:
          $ref: "#/components/schemas/FxRateSource"
        broker:
          type: string
          nullable: true
          description: "Broker or platform through which the trade was executed"
        notes:
          type: string
          nullable: true
          description: "Free-form notes or context for this transaction"

    TransactionRequest:
      type: object
      required:
        - listingId
        - type
        - quantity
        - price
        - date
      properties:
        listingId:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/TransactionType"
        quantity:
          type: number
          format: double
        price:
          type: number
          format: double
        date:
          type: string
          format: date
        fees:
          type: number
          format: double
          nullable: true
        fxRate:
          type: number
          format: double
          nullable: true
          description: "Override the FX rate. If omitted, the server will look it up automatically."
        broker:
          type: string
          nullable: true
          description: "Broker or platform through which the trade was executed"
        notes:
          type: string
          nullable: true
          description: "Free-form notes or context for this transaction"

    TransactionType:
      type: string
      enum:
        - BUY
        - SELL
        - SPLIT

    FxRateSource:
      type: string
      nullable: true
      enum:
        - AUTO
        - USER
        - IMPORTED

    FxRatePoint:
      type: object
      required: [rate, date]
      properties:
        rate:
          type: number
          format: double
        date:
          type: string
          format: date
          description: Actual date of the rate (may be earlier than requested due to weekends/holidays)

    PriceMapping:
      type: object
      required: [id, listingId, provider, externalId]
      properties:
        id:
          type: integer
          format: int64
        listingId:
          type: integer
          format: int64
        provider:
          type: string
          example: YAHOO
        externalId:
          type: string
          example: VWCE.AS

    PriceMappingRequest:
      type: object
      required: [externalId]
      properties:
        externalId:
          type: string
          example: VWCE.AS

    PricePoint:
      type: object
      required: [date, price]
      properties:
        date:
          type: string
          format: date
        price:
          type: number
          format: double

    SyncResult:
      type: object
      required: [synced, failed]
      properties:
        synced:
          type: integer
        failed:
          type: integer

    RealizationMethod:
      type: string
      enum:
        - FIFO
        - AVERAGE_COST

    RealizedGainEntry:
      type: object
      required:
        - assetId
        - ticker
        - currency
        - date
        - quantity
        - proceeds
        - buyFees
        - sellFees
        - costBasis
        - gain
      properties:
        assetId:
          type: integer
          format: int64
        ticker:
          type: string
        currency:
          type: string
          description: Local currency of the sell transaction.
          example: EUR
        date:
          type: string
          format: date
        quantity:
          type: number
          format: double
        proceeds:
          type: number
          format: double
          description: In local currency.
        buyFees:
          type: number
          format: double
          description: In local currency.
        sellFees:
          type: number
          format: double
          description: In local currency.
        costBasis:
          type: number
          format: double
          description: In local currency.
        gain:
          type: number
          format: double
          description: In local currency. Do not sum across currencies.

    RealizedGainsReport:
      type: object
      required:
        - method
        - from
        - to
        - entries
        - byCurrency
      properties:
        method:
          $ref: "#/components/schemas/RealizationMethod"
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        entries:
          type: array
          items:
            $ref: "#/components/schemas/RealizedGainEntry"
        byCurrency:
          type: object
          description: Per-currency totals. Safe to display independently; never sum across currencies.
          additionalProperties:
            $ref: "#/components/schemas/CurrencyTotal"

    CurrencyTotal:
      type: object
      required:
        - currency
        - tradeCount
        - totalProceeds
        - totalCostBasis
        - totalGain
      properties:
        currency:
          type: string
        tradeCount:
          type: integer
        totalProceeds:
          type: number
          format: double
        totalCostBasis:
          type: number
          format: double
        totalGain:
          type: number
          format: double

    Settings:
      type: object
      required:
        - baseCurrency
      properties:
        baseCurrency:
          type: string
          example: EUR

    Holding:
      type: object
      description: Asset-level holdings view with per-listing drill-down. All monetary values are in baseCurrency.
      required:
        - assetId
        - assetName
        - baseCurrency
        - totalQuantity
        - listings
      properties:
        assetId:
          type: integer
          format: int64
        assetName:
          type: string
        baseCurrency:
          type: string
          example: EUR
        totalQuantity:
          type: number
          format: double
        avgCostBasisBase:
          type: number
          format: double
          nullable: true
          description: FX-normalized weighted average cost per unit. Null when any listing lacks an FX rate.
        totalCostBase:
          type: number
          format: double
          nullable: true
          description: FX-normalized total cost. Null when any listing lacks an FX rate.
        marketValueBase:
          type: number
          format: double
          nullable: true
        unrealizedPnlBase:
          type: number
          format: double
          nullable: true
        unrealizedPnlPct:
          type: number
          format: double
          nullable: true
        listings:
          type: array
          items:
            $ref: "#/components/schemas/ListingHolding"

    ListingHolding:
      type: object
      required:
        - listingId
        - ticker
        - currency
        - quantity
        - avgCostLocal
        - totalCostLocal
      properties:
        listingId:
          type: integer
          format: int64
        exchange:
          type: string
          nullable: true
        ticker:
          type: string
        currency:
          type: string
          example: USD
        quantity:
          type: number
          format: double
        avgCostLocal:
          type: number
          format: double
        totalCostLocal:
          type: number
          format: double
        marketValueLocal:
          type: number
          format: double
          nullable: true
        fxRate:
          type: number
          format: double
          nullable: true
          description: Rate used for conversion (1 baseCurrency = fxRate listingCurrency). Null when currencies match.
        marketValueBase:
          type: number
          format: double
          nullable: true
    ListingWithPrice:
      type: object
      required:
        - id
        - assetId
        - ticker
        - currency
      properties:
        id:
          type: integer
          format: int64
        assetId:
          type: integer
          format: int64
        exchange:
          type: string
          nullable: true
          example: Euronext Amsterdam
        ticker:
          type: string
          example: VWCE
        currency:
          type: string
          example: EUR
        lastPriceDate:
          type: string
          format: date
          nullable: true
          description: Date of the most recent price in the price history
        lastPrice:
          type: number
          format: double
          nullable: true
          description: Most recent closing price

    SyncType:
      type: string
      enum:
        - PRICE
        - FX

    SyncTrigger:
      type: string
      enum:
        - MANUAL
        - SCHEDULED

    SyncStatus:
      type: string
      enum:
        - SUCCESS
        - FAILED
        - PARTIAL

    SyncHistoryEntry:
      type: object
      required:
        - id
        - type
        - trigger
        - status
        - startedAt
        - durationMs
        - synced
        - failed
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/SyncType"
        trigger:
          $ref: "#/components/schemas/SyncTrigger"
        status:
          $ref: "#/components/schemas/SyncStatus"
        startedAt:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the sync started
        durationMs:
          type: integer
          format: int64
          description: Duration of the sync in milliseconds
        synced:
          type: integer
        failed:
          type: integer

    BoleroAnalysisResult:
      type: object
      required: [instruments, totalRows, skippedRows]
      properties:
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/BoleroInstrumentInfo"
        totalRows:
          type: integer
          description: Total investment rows found (buys + sells)
        skippedRows:
          type: integer
          description: Non-investment rows (deposits, refunds, parse errors) found during analysis

    BoleroInstrumentInfo:
      type: object
      required: [externalName, rowCount]
      properties:
        externalName:
          type: string
          description: The instrument name as it appears in the Bolero export
        rowCount:
          type: integer
          description: Number of investment transactions for this instrument
        mapping:
          $ref: "#/components/schemas/AssetImportMappingRef"
          nullable: true

    AssetImportMappingRef:
      type: object
      required: [id, assetId]
      properties:
        id:
          type: integer
          format: int64
        assetId:
          type: integer
          format: int64

    ImportResult:
      type: object
      required: [imported, skipped, rows]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/ImportRowResult"

    ImportRowResult:
      type: object
      required: [line, status, reason]
      properties:
        line:
          type: integer
        status:
          type: string
          enum: [IMPORTED, SKIPPED]
        reason:
          type: string

    AssetImportMapping:
      type: object
      required: [id, broker, externalName, assetId]
      properties:
        id:
          type: integer
          format: int64
        broker:
          type: string
        externalName:
          type: string
        assetId:
          type: integer
          format: int64

    CreateAssetImportMappingRequest:
      type: object
      required: [broker, externalName, assetId]
      properties:
        broker:
          type: string
        externalName:
          type: string
        assetId:
          type: integer
          format: int64

    PortfolioValuePoint:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
        value:
          type: number
          format: double
          nullable: true
          description: >
            Market value in base currency on this date. Null when any open holding lacks a
            price or FX rate (partial sums are not returned to avoid understating the portfolio).
        invested:
          type: number
          format: double
          nullable: true
          description: >
            Net cumulative cash invested in base currency (BUY costs minus SELL proceeds),
            using the FX rate recorded on each transaction.

    PortfolioValueHistory:
      type: object
      required: [baseCurrency, points]
      properties:
        baseCurrency:
          type: string
          example: EUR
        points:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioValuePoint"

    DataImportAnalysis:
      type: object
      required:
        - errors
        - assetsToCreate
        - assetsExisting
        - listingsToCreate
        - listingsExisting
        - portfoliosToCreate
        - portfoliosExisting
        - transactionsToImport
        - transactionsSkipped
      properties:
        errors:
          type: array
          items:
            type: string
        assetsToCreate:
          type: integer
        assetsExisting:
          type: integer
        listingsToCreate:
          type: integer
        listingsExisting:
          type: integer
        portfoliosToCreate:
          type: integer
        portfoliosExisting:
          type: integer
        transactionsToImport:
          type: integer
        transactionsSkipped:
          type: integer

    DataImportResult:
      type: object
      required:
        - assetsCreated
        - listingsCreated
        - portfoliosCreated
        - transactionsImported
      properties:
        assetsCreated:
          type: integer
        listingsCreated:
          type: integer
        portfoliosCreated:
          type: integer
        transactionsImported:
          type: integer

    DashboardWidgetType:
      type: string
      enum: [LISTING_PRICE, PORTFOLIO_VALUE]

    ListingPriceConfig:
      type: object
      required:
        - targetId
        - range
      properties:
        targetId:
          type: integer
          format: int64
        range:
          type: string

    PortfolioValueConfig:
      type: object
      required:
        - targetId
        - range
      properties:
        targetId:
          type: integer
          format: int64
        range:
          type: string

    DashboardWidget:
      type: object
      required:
        - id
        - type
        - config
        - label
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/DashboardWidgetType"
        config:
          oneOf:
            - $ref: "#/components/schemas/ListingPriceConfig"
            - $ref: "#/components/schemas/PortfolioValueConfig"
        label:
          type: string
        currency:
          type: string
          nullable: true

    AddDashboardWidgetRequest:
      type: object
      required:
        - type
        - config
      properties:
        type:
          $ref: "#/components/schemas/DashboardWidgetType"
        config:
          oneOf:
            - $ref: "#/components/schemas/ListingPriceConfig"
            - $ref: "#/components/schemas/PortfolioValueConfig"

    UpdateDashboardWidgetRequest:
      type: object
      required:
        - config
      properties:
        config:
          type: object
          required:
            - range
          properties:
            range:
              type: string
