openapi: 3.1.0

info:
  title: simpletickr API
  version: 0.1.0
  description: Simple portfolio tracker for ETFs, stocks, and crypto.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8080
    description: Local development

security: []

tags:
  - name: Portfolios
  - name: Assets
  - name: Transactions

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: UP
        "4XX":
          description: Client error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "5XX":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /portfolios:
    get:
      tags: [Portfolios]
      operationId: listPortfolios
      summary: List all portfolios
      responses:
        "200":
          description: List of portfolios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Portfolio"
    post:
      tags: [Portfolios]
      operationId: createPortfolio
      summary: Create a portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioRequest"
      responses:
        "201":
          description: Portfolio created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"

  /portfolios/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Portfolios]
      operationId: getPortfolio
      summary: Get a portfolio by ID
      responses:
        "200":
          description: Portfolio found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Portfolios]
      operationId: updatePortfolio
      summary: Update a portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioRequest"
      responses:
        "200":
          description: Portfolio updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Portfolios]
      operationId: deletePortfolio
      summary: Delete a portfolio
      responses:
        "204":
          description: Portfolio deleted
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /portfolios/{id}/holdings:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Portfolios]
      operationId: getHoldings
      summary: Get computed holdings for a portfolio
      responses:
        "200":
          description: Holdings for the portfolio
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holding"
        "404":
          description: Portfolio not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: List all assets
      responses:
        "200":
          description: List of assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      tags: [Assets]
      operationId: createAsset
      summary: Create an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetRequest"
      responses:
        "201":
          description: Asset created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Get an asset by ID
      responses:
        "200":
          description: Asset found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Assets]
      operationId: updateAsset
      summary: Update an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetRequest"
      responses:
        "200":
          description: Asset updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Assets]
      operationId: deleteAsset
      summary: Delete an asset
      responses:
        "204":
          description: Asset deleted
        "404":
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List transactions, optionally filtered by portfolio
      parameters:
        - name: portfolioId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Record a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
      responses:
        "201":
          description: Transaction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get a transaction by ID
      responses:
        "200":
          description: Transaction found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [Transactions]
      operationId: updateTransaction
      summary: Update a transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
      responses:
        "200":
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Transactions]
      operationId: deleteTransaction
      summary: Delete a transaction
      responses:
        "204":
          description: Transaction deleted
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    Portfolio:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string

    PortfolioRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    Asset:
      type: object
      required:
        - id
        - ticker
        - name
        - type
        - currency
      properties:
        id:
          type: integer
          format: int64
        ticker:
          type: string
          example: AAPL
        name:
          type: string
          example: Apple Inc.
        type:
          $ref: "#/components/schemas/AssetType"
        currency:
          type: string
          example: USD
        currentPrice:
          type: number
          format: double
          nullable: true

    AssetRequest:
      type: object
      required:
        - ticker
        - name
        - type
        - currency
      properties:
        ticker:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/AssetType"
        currency:
          type: string
        currentPrice:
          type: number
          format: double
          nullable: true

    AssetType:
      type: string
      enum:
        - STOCK
        - ETF
        - CRYPTO
        - OTHER

    Transaction:
      type: object
      required:
        - id
        - portfolioId
        - assetId
        - type
        - quantity
        - price
        - date
      properties:
        id:
          type: integer
          format: int64
        portfolioId:
          type: integer
          format: int64
        assetId:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/TransactionType"
        quantity:
          type: number
          format: double
        price:
          type: number
          format: double
        date:
          type: string
          format: date
        fees:
          type: number
          format: double
          nullable: true

    TransactionRequest:
      type: object
      required:
        - portfolioId
        - assetId
        - type
        - quantity
        - price
        - date
      properties:
        portfolioId:
          type: integer
          format: int64
        assetId:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/TransactionType"
        quantity:
          type: number
          format: double
        price:
          type: number
          format: double
        date:
          type: string
          format: date
        fees:
          type: number
          format: double
          nullable: true

    TransactionType:
      type: string
      enum:
        - BUY
        - SELL

    Holding:
      type: object
      required:
        - assetId
        - ticker
        - name
        - quantity
        - avgCostBasis
        - totalCost
      properties:
        assetId:
          type: integer
          format: int64
        ticker:
          type: string
        name:
          type: string
        quantity:
          type: number
          format: double
        avgCostBasis:
          type: number
          format: double
        totalCost:
          type: number
          format: double
        unrealizedGain:
          type: number
          format: double
          nullable: true