name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION="${LATEST#v}"
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY || 'ghcr.io' }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY || 'ghcr.io' }}/${{ secrets.REGISTRY_PROJECT || github.repository_owner }}/simpletickr-backend:${{ steps.version.outputs.version }}
            ${{ secrets.REGISTRY || 'ghcr.io' }}/${{ secrets.REGISTRY_PROJECT || github.repository_owner }}/simpletickr-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY || 'ghcr.io' }}/${{ secrets.REGISTRY_PROJECT || github.repository_owner }}/simpletickr-frontend:${{ steps.version.outputs.version }}
            ${{ secrets.REGISTRY || 'ghcr.io' }}/${{ secrets.REGISTRY_PROJECT || github.repository_owner }}/simpletickr-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish Helm chart
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHART_VERSION="${VERSION#v}"
          REGISTRY="${{ secrets.REGISTRY || 'ghcr.io' }}"
          PROJECT="${{ secrets.REGISTRY_PROJECT || github.repository_owner }}"
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build charts/simpletickr
          helm package charts/simpletickr \
            --version "${CHART_VERSION}" \
            --app-version "${VERSION}"
          helm push "simpletickr-${CHART_VERSION}.tgz" "oci://${REGISTRY}/${PROJECT}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes
