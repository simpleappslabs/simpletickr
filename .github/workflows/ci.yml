name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_NAME: simpletickr
      DB_USER: simpletickr
      DB_PASSWORD: simpletickr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PUBLIC_API_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run codegen
      - run: npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build charts/simpletickr
      - name: Lint
        run: helm lint charts/simpletickr --set backend.db.host=localhost --set backend.db.password=secret
      - name: Template
        run: helm template simpletickr charts/simpletickr --set backend.db.host=localhost --set backend.db.password=secret > /dev/null

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: simpletickr
          POSTGRES_USER: simpletickr
          POSTGRES_PASSWORD: simpletickr
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: simpletickr
      DB_USER: simpletickr
      DB_PASSWORD: simpletickr
      PUBLIC_API_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start backend
        working-directory: backend
        run: ./gradlew bootRun &
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate API client
        working-directory: frontend
        run: npm run codegen
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Wait for backend
        run: until curl -s http://localhost:8080/health; do sleep 2; done
        timeout-minutes: 2
      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e
