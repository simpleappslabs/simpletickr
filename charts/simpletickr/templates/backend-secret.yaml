{{- if and (not .Values.postgresql.enabled) (not .Values.backend.db.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "simpletickr.backend.fullname" . }}
  labels:
    {{- include "simpletickr.backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ required "backend.db.password is required when postgresql.enabled is false" .Values.backend.db.password | quote }}
{{- end }}
