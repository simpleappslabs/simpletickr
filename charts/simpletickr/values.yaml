# Global image settings — tag applies to both backend and frontend.
# Defaults to the chart's appVersion when left empty.
imagePullSecrets: []

image:
  registry: ghcr.io
  project: simpleappslabs
  tag: ""
  pullPolicy: IfNotPresent

backend:
  replicaCount: 1
  image:
    repository: simpletickr-backend
  service:
    type: ClusterIP
    port: 8080
  # Comma-separated list of allowed CORS origins.
  # Defaults to localhost dev origins when left empty.
  corsAllowedOrigins: ""
  # DB connection — required when postgresql.enabled is false
  db:
    host: ""
    port: 5432
    name: simpletickr
    user: simpletickr
    password: ""
    # Use an existing secret instead of creating one from backend.db.password
    existingSecret:
      name: ""
      key: db-password

frontend:
  replicaCount: 1
  image:
    repository: simpletickr-frontend
  service:
    type: ClusterIP
    port: 3000
  # Overrides the backend URL seen by the frontend.
  # Defaults to a same-origin "/api" path when ingress.enabled, otherwise
  # the backend ClusterIP service within the cluster.
  apiBaseUrl: ""

# Shared Ingress serving both frontend and backend under one or more
# hostnames: frontend at "/", backend API at "/api". The backend always
# answers under "/api" (its Spring servlet context-path default), whether
# or not this Ingress is enabled.
ingress:
  enabled: false
  className: ""
  # One Ingress resource serves all of these hostnames. List more than one
  # to expose the same app under multiple domains (e.g. a LAN hostname and
  # a Tailscale hostname pointing at the same instances).
  hosts:
    - simpletickr.example.com
  # Arbitrary annotations for the Ingress resource (e.g. cert-manager's
  # cluster-issuer, nginx-specific tuning). Empty by default.
  annotations: {}
  tls:
    enabled: false
    # Leave blank to generate one Secret per host (<release>-tls-<host>).
    # Set to share one certificate (e.g. a multi-SAN cert) across all hosts.
    secretName: ""

# Optional Bitnami PostgreSQL subchart for dev clusters.
# Set postgresql.enabled=true to deploy PostgreSQL alongside the app.
# When enabled, backend.db.* values are ignored in favour of postgresql.auth.*.
postgresql:
  enabled: false
  auth:
    database: simpletickr
    username: simpletickr
    password: ""
