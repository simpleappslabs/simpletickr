version: "3"

dotenv: ['.env']

tasks:
  up:
    desc: Start PostgreSQL via Docker Compose
    cmds:
      - docker compose up -d db

  api:lint:
    desc: Lint openapi.yaml with Redocly
    cmds:
      - npx @redocly/cli lint --config .redocly.yaml openapi.yaml

  backend:build:
    desc: Compile and assemble the backend JAR
    dir: backend
    cmds:
      - ./gradlew build

  backend:test:
    desc: Run backend tests
    dir: backend
    cmds:
      - ./gradlew test

  backend:run:
    desc: Start the backend
    dir: backend
    cmds:
      - ./gradlew bootRun

  backend:clean:
    desc: Clean backend build outputs
    dir: backend
    cmds:
      - ./gradlew clean

  frontend:dev:
    desc: Start the frontend dev server
    dir: frontend
    cmds:
      - npm run dev

  frontend:build:
    desc: Build the frontend for production
    dir: frontend
    cmds:
      - npm run build

  frontend:test:
    desc: Run frontend unit tests
    dir: frontend
    cmds:
      - npm run test

  frontend:test:e2e:
    desc: Run frontend E2E tests (requires backend on localhost:8080)
    dir: frontend
    cmds:
      - npm run test:e2e

  frontend:test:e2e:ui:
    desc: Run frontend E2E tests in Playwright UI mode (visual debugger with time-travel)
    dir: frontend
    cmds:
      - npx playwright test --ui

  frontend:check:
    desc: Type-check the frontend with svelte-check
    dir: frontend
    cmds:
      - npm run check

  frontend:codegen:
    desc: Generate typed API client from openapi.yaml
    dir: frontend
    cmds:
      - npm run codegen

  frontend:ci:
    desc: Codegen, type-check, and build the frontend
    dir: frontend
    cmds:
      - npm run codegen
      - npm run check
      - npm run build

  docker:build:backend:
    desc: Build the backend Docker image
    cmds:
      - docker build -f backend/Dockerfile -t simpletickr-backend:{{.IMAGE_TAG | default "local"}} .
    vars:
      IMAGE_TAG: '{{.IMAGE_TAG}}'

  docker:build:frontend:
    desc: Build the frontend Docker image
    cmds:
      - docker build -f frontend/Dockerfile -t simpletickr-frontend:{{.IMAGE_TAG | default "local"}} .
    vars:
      IMAGE_TAG: '{{.IMAGE_TAG}}'

  docker:build:
    desc: Build all Docker images
    deps:
      - docker:build:backend
      - docker:build:frontend

  ci:
    desc: Run all tests and linting locally (excludes E2E)
    deps:
      - api:lint
      - backend:build
      - frontend:ci