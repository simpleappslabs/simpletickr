version: "3"

dotenv: ['.env']

tasks:
  up:
    desc: Start PostgreSQL via Docker Compose
    cmds:
      - docker compose up -d db

  api:lint:
    desc: Lint openapi.yaml with Redocly
    cmds:
      - npx @redocly/cli lint --config .redocly.yaml openapi.yaml

  backend:build:
    desc: Compile and assemble the backend JAR
    dir: backend
    cmds:
      - ./gradlew build

  backend:test:
    desc: Run backend tests
    dir: backend
    cmds:
      - ./gradlew test

  backend:run:
    desc: Start the backend
    dir: backend
    cmds:
      - ./gradlew bootRun

  backend:clean:
    desc: Clean backend build outputs
    dir: backend
    cmds:
      - ./gradlew clean

  frontend:dev:
    desc: Start the frontend dev server
    dir: frontend
    cmds:
      - npm run dev

  frontend:build:
    desc: Build the frontend for production
    dir: frontend
    cmds:
      - npm run build

  frontend:test:
    desc: Run frontend tests
    dir: frontend
    cmds:
      - npm run test

  frontend:lint:
    desc: Lint the frontend
    dir: frontend
    cmds:
      - npm run lint

  frontend:codegen:
    desc: Generate typed API client from openapi.yaml
    dir: frontend
    cmds:
      - npm run codegen