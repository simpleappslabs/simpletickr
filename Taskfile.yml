version: "3"

dotenv: ['.env']

tasks:
  up:
    desc: Start PostgreSQL via Docker Compose
    cmds:
      - docker compose up -d db

  db:reset:
    desc: Drop and recreate the dev database (Flyway migrates on next backend start)
    cmds:
      - docker compose exec db psql -U ${DB_USER} postgres -c "DROP DATABASE IF EXISTS \"${DB_NAME}\""
      - docker compose exec db psql -U ${DB_USER} postgres -c "CREATE DATABASE \"${DB_NAME}\""

  db:seed:
    desc: Seed the dev database with a demo portfolio and transactions (requires running backend)
    vars:
      API: '{{.API | default "http://localhost:8080"}}'
    cmds:
      - API={{.API}} ./scripts/seed-demo.sh

  api:lint:
    desc: Lint openapi.yaml with Redocly
    cmds:
      - npx @redocly/cli lint --config .redocly.yaml openapi.yaml

  backend:build:
    desc: Compile and assemble the backend JAR
    dir: backend
    cmds:
      - ./gradlew build

  backend:test:
    desc: Run backend tests
    dir: backend
    cmds:
      - ./gradlew test

  backend:test:unit:
    desc: Run backend unit tests only (fast, no Spring context)
    dir: backend
    cmds:
      - ./gradlew unitTest

  backend:test:integration:
    desc: Run backend integration tests only (Spring context / Testcontainers)
    dir: backend
    cmds:
      - ./gradlew integrationTest

  backend:run:
    desc: Start the backend
    dir: backend
    cmds:
      - ./gradlew bootRun

  backend:clean:
    desc: Clean backend build outputs
    dir: backend
    cmds:
      - ./gradlew clean

  frontend:dev:
    desc: Start the frontend dev server
    dir: frontend
    cmds:
      - npm run dev

  frontend:build:
    desc: Build the frontend for production
    dir: frontend
    cmds:
      - npm run build

  frontend:test:
    desc: Run frontend unit tests
    dir: frontend
    cmds:
      - docker compose --profile test up -d --wait --force-recreate db-test
      - npm run test

  frontend:test:e2e:
    desc: Run E2E tests against an isolated test DB (always recreates containers for a clean state)
    cmds:
      - docker compose --profile test up -d --wait --force-recreate db-test
      - cd frontend && npm run test:e2e

  frontend:test:e2e:ui:
    desc: Run frontend E2E tests in Playwright UI mode (always recreates containers for a clean state)
    cmds:
      - docker compose --profile test up -d --wait --force-recreate db-test
      - cd frontend && npx playwright test --ui

  frontend:check:
    desc: Type-check the frontend with svelte-check
    dir: frontend
    cmds:
      - npm run check

  frontend:codegen:
    desc: Generate typed API client from openapi.yaml
    dir: frontend
    cmds:
      - npm run codegen

  frontend:ci:
    desc: Codegen, type-check, and build the frontend
    dir: frontend
    cmds:
      - npm run codegen
      - npm run check
      - npm run build

  docker:build:backend:
    desc: Build the backend Docker image
    cmds:
      - docker build -f backend/Dockerfile -t simpletickr-backend:{{.IMAGE_TAG | default "local"}} .
    vars:
      IMAGE_TAG: '{{.IMAGE_TAG}}'

  docker:build:frontend:
    desc: Build the frontend Docker image
    cmds:
      - docker build -f frontend/Dockerfile -t simpletickr-frontend:{{.IMAGE_TAG | default "local"}} .
    vars:
      IMAGE_TAG: '{{.IMAGE_TAG}}'

  docker:build:
    desc: Build all Docker images
    deps:
      - docker:build:backend
      - docker:build:frontend

  helm:lint:
    desc: Lint the Helm chart
    cmds:
      - helm lint charts/simpletickr

  helm:template:
    desc: Render chart templates to stdout (dry-run)
    cmds:
      - helm template simpletickr charts/simpletickr --set backend.db.host=localhost --set backend.db.password=secret

  ci:
    desc: Run all tests and linting locally (excludes E2E)
    deps:
      - api:lint
      - backend:build
      - frontend:ci