services:
  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  db-test:
    profiles: [test]
    image: postgres:17
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: simpletickr_test
      POSTGRES_USER: simpletickr
      POSTGRES_PASSWORD: simpletickr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simpletickr -d simpletickr_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
