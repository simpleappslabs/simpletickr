# DEV-ONLY Authelia config for manually exercising simpletickr's OIDC client (issue #57)
# against a real IdP. Every secret in this file is a fixed, throwaway dev value — never use
# any of it for anything real. See dev/authelia/README.md for how to run it.

server:
  address: 'tcp://:9091'
  tls:
    certificate: '/config/tls.crt'
    key: '/config/tls.key'

log:
  level: 'info'

identity_validation:
  reset_password:
    jwt_secret: 'dev-reset-password-jwt-secret'

authentication_backend:
  file:
    path: '/config/users_database.yml'

session:
  secret: 'dev-session-secret'
  cookies:
    - domain: '127.0.0.1'
      authelia_url: 'https://127.0.0.1:9091'

storage:
  encryption_key: 'dev-storage-encryption-key-32-chars-min'
  local:
    path: '/config/db.sqlite3'

notifier:
  filesystem:
    filename: '/config/notification.txt'

access_control:
  default_policy: 'one_factor'

identity_providers:
  oidc:
    hmac_secret: 'dev-oidc-hmac-secret'
    jwks:
      - key_id: 'dev'
        algorithm: 'RS256'
        use: 'sig'
